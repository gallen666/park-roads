<head>
<meta charset="utf-8">

<title>中小企业 AI 管理系统</title>
<meta name="description" content="基于十部经营框架的私有 AI 经营系统：诊断企业错点、生成可核验承诺、追踪兑现并支持顾问协同。">
<link rel="icon" href="favicon.svg">
<style>
  html,body{background:#0B1526;color:#fff;margin:0;min-height:100%;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #boot-error{display:none;padding:24px;white-space:pre-wrap;color:#ffb4b4}
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript>本工作台需要启用 JavaScript 才能加载经营看板。</noscript>
<pre id="boot-error"></pre>
<div id="root" data-cloud-app="true">
  <div class="cloud-app-loading" role="status"><span class="spin" aria-hidden="true"></span>正在加载经营看板…</div>
</div>
<script id="app-bootstrap" type="application/json">
{"user":{"id":"local-owner","name":"戴 继涛"},"signInUrl":"./","signOutUrl":"./"}
</script>
<script>
window.addEventListener("error", function (ev) {
  var el = document.getElementById("boot-error");
  if (!el) return;
  el.style.display = "block";
  el.textContent = (ev.message || "脚本错误") + "\n" + (ev.filename || "") + ":" + (ev.lineno || "");
});
window.addEventListener("unhandledrejection", function (ev) {
  var el = document.getElementById("boot-error");
  if (!el) return;
  el.style.display = "block";
  el.textContent = String(ev.reason && ev.reason.message ? ev.reason.message : ev.reason || "未处理的 Promise 错误");
});
</script>
<script src="js/app.js?v=jt20260822-tianlong10"></script>
</body>
</html>
